<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WS-FS | Flight Dispatch</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-panel: #0d121d;
      --bg-card: rgba(16, 22, 35, 0.85);
      --border-glow: rgba(0, 242, 254, 0.2);
      --cyan-primary: #00f2fe;
      --cyan-glow: rgba(0, 242, 254, 0.25);
      --green-accent: #10b981;
      --red-accent: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --radius-lg: 14px;
      --radius-md: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    header {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-glow);
      background: rgba(7, 9, 14, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--cyan-primary), #4f46e5);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--cyan-glow);
      color: #000;
      font-size: 0.9rem;
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(to right, #ffffff, var(--cyan-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dispatch-container {
      display: grid;
      grid-template-columns: 420px 1fr;
      height: calc(100vh - 60px);
    }

    @media (max-width: 1024px) {
      .dispatch-container {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .control-panel {
      background: var(--bg-panel);
      border-right: 1px solid var(--border-glow);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-section {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyan-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .field-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .sim-input, .sim-select {
      background: #07090e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      width: 100%;
    }

    .sim-input:focus, .sim-select:focus {
      outline: none;
      border-color: var(--cyan-primary);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    .airport-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #07090e;
      border: 1px solid var(--cyan-primary);
      border-radius: var(--radius-md);
      max-height: 160px;
      overflow-y: auto;
      z-index: 2000;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .airport-dropdown.show {
      display: block;
    }

    .airport-item {
      padding: 8px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .airport-item:hover {
      background: rgba(0, 242, 254, 0.15);
      color: var(--cyan-primary);
    }

    .btn-generate {
      background: linear-gradient(135deg, var(--cyan-primary), #0284c7);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: var(--radius-md);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px var(--cyan-primary);
    }

    .map-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 450px;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #07090e;
    }

    .flight-status-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(13, 18, 29, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-label {
      font-size: 0.68rem;
      color: var(--text-sub);
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-value {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--cyan-primary);
    }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #0d121d !important;
      color: #fff !important;
      border: 1px solid var(--cyan-primary);
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">
        <i class="fa-solid fa-plane"></i>
      </div>
      <span class="brand-title">WS-FS Direct Dispatch</span>
    </div>
    <div style="font-size: 0.8rem; color: var(--text-sub);" class="font-mono">GEOFS ROUTE ENGINE</div>
  </header>

  <div class="dispatch-container">
    
    <!-- LEFT CONTROL PANEL -->
    <div class="control-panel">
      
      <div class="panel-section">
        <div class="section-title"><span><i class="fa-solid fa-route"></i> Route Parameters</span></div>
        
        <div class="grid-2">
          <div class="field-group">
            <label class="field-label">Departure (ICAO)</label>
            <input type="text" id="input-dep" class="sim-input font-mono" value="BKPR" placeholder="Search ICAO..." oninput="searchAirport(this.value, 'dep-results')" />
            <div id="dep-results" class="airport-dropdown"></div>
          </div>
          <div class="field-group">
            <label class="field-label">Arrival (ICAO)</label>
            <input type="text" id="input-arr" class="sim-input font-mono" value="LSZH" placeholder="Search ICAO..." oninput="searchAirport(this.value, 'arr-results')" />
            <div id="arr-results" class="airport-dropdown"></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="field-group">
            <label class="field-label">Departure Runway</label>
            <select id="select-dep-rwy" class="sim-select font-mono"><option value="AUTO">AUTO (Best Alignment)</option></select>
          </div>
          <div class="field-group">
            <label class="field-label">Arrival Runway</label>
            <select id="select-arr-rwy" class="sim-select font-mono"><option value="AUTO">AUTO (Best Alignment)</option></select>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-title"><span><i class="fa-solid fa-plane-up"></i> Aircraft & Profile</span></div>
        
        <div class="grid-2">
          <div class="field-group">
            <label class="field-label">Aircraft Model</label>
            <select class="sim-select font-mono">
              <option>Boeing 737-800</option>
              <option selected>Airbus A320-200</option>
              <option>Boehringer 777-300ER</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Cruise Altitude</label>
            <input type="text" class="sim-input font-mono" value="FL350" />
          </div>
        </div>
      </div>

      <button class="btn-generate" onclick="generateAndVerifyFlight()">
        <i class="fa-solid fa-bolt"></i>
        <span>Generate & Verify Flight Plan</span>
      </button>

      <div class="panel-section" style="flex-grow: 1;">
        <div class="section-title"><span><i class="fa-solid fa-list-check"></i> Waypoint Log</span></div>
        <div id="waypoint-log" class="font-mono" style="font-size: 0.75rem; color: var(--text-sub); line-height: 1.6; max-height: 180px; overflow-y: auto;">
          Ready to verify runway centerlines and build waypoint chain...
        </div>
      </div>

    </div>

    <!-- RIGHT MAP VIEW -->
    <div class="map-container">
      <div id="map"></div>

      <div class="flight-status-bar">
        <div class="status-item">
          <span class="status-label">Distance</span>
          <span id="stat-dist" class="status-value font-mono">-- NM</span>
        </div>
        <div class="status-item">
          <span class="status-label">Estimated Heading</span>
          <span id="stat-hdg" class="status-value font-mono">--°</span>
        </div>
        <div class="status-item">
          <span class="status-label">Runway Alignment Status</span>
          <span id="stat-status" class="status-value font-mono" style="color: var(--green-accent);">VERIFIED & LOCKED</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Leaflet & Script Logic -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Comprehensive Airport Database
    const airports = {
      "BKPR": { name: "Pristina International", lat: 42.5728, lon: 21.0358, rwys: ["17", "35"] },
      "LSZH": { name: "Zurich Airport", lat: 47.4647, lon: 8.5492, rwys: ["14", "16", "28", "32", "34"] },
      "EDDF": { name: "Frankfurt Airport", lat: 50.0379, lon: 8.5622, rwys: ["07L", "07R", "25L", "25R", "18"] },
      "EGLL": { name: "London Heathrow", lat: 51.4700, lon: -0.4543, rwys: ["09L", "09R", "27L", "27R"] },
      "KJFK": { name: "John F. Kennedy Intl", lat: 40.6413, lon: -73.7781, rwys: ["04L", "04R", "13L", "22L", "22R", "31L", "31R"] },
      "KLAX": { name: "Los Angeles Intl", lat: 33.9416, lon: -118.4085, rwys: ["06L", "06R", "07L", "07R", "24L", "24R", "25L", "25R"] },
      "OMDB": { name: "Dubai International", lat: 25.2532, lon: 55.3657, rwys: ["12L", "12R", "30L", "30R"] },
      "LFPG": { name: "Paris Charles de Gaulle", lat: 49.0097, lon: 2.5479, rwys: ["08L", "08R", "09L", "09R", "26L", "26R", "27L", "27R"] }
    };

    // Initialize Leaflet Map
    const map = L.map('map', { zoomControl: false }).setView([44.5, 14.5], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap & CARTO'
    }).addTo(map);

    let currentLayerGroup = L.layerGroup().addTo(map);

    function searchAirport(query, dropdownId) {
      const dropdown = document.getElementById(dropdownId);
      const clean = query.trim().toUpperCase();
      if (!clean) { dropdown.classList.remove('show'); return; }

      const matches = Object.keys(airports).filter(code => code.includes(clean) || airports[code].name.toUpperCase().includes(clean));
      if (matches.length === 0) { dropdown.classList.remove('show'); return; }

      dropdown.innerHTML = "";
      matches.forEach(code => {
        const ap = airports[code];
        const item = document.createElement('div');
        item.className = 'airport-item font-mono';
        item.innerHTML = `<span><b>${code}</b> - ${ap.name}</span>`;
        item.onclick = () => selectAirport(code, dropdownId);
        dropdown.appendChild(item);
      });
      dropdown.classList.add('show');
    }

    function selectAirport(code, dropdownId) {
      if (dropdownId === 'dep-results') {
        document.getElementById('input-dep').value = code;
        updateRunways('select-dep-rwy', code);
      } else {
        document.getElementById('input-arr').value = code;
        updateRunways('select-arr-rwy', code);
      }
      document.getElementById(dropdownId).classList.remove('show');
    }

    function updateRunways(selectId, code) {
      const sel = document.getElementById(selectId);
      sel.innerHTML = `<option value="AUTO">AUTO (Best Alignment)</option>`;
      if (airports[code] && airports[code].rwys) {
        airports[code].rwys.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r;
          opt.innerText = `RWY ${r}`;
          sel.appendChild(opt);
        });
      }
    }

    // Haversine formula for distance & bearing
    function calculateFlightMetrics(lat1, lon1, lat2, lon2) {
      const R = 3440.065; // Nautical miles
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const dist = R * c;

      const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
      let brng = Math.atan2(y, x) * 180 / Math.PI;
      brng = (brng + 360) % 360;

      return { dist: Math.round(dist), brng: Math.round(brng) };
    }

    function generateAndVerifyFlight() {
      const depCode = document.getElementById('input-dep').value.trim().toUpperCase();
      const arrCode = document.getElementById('input-arr').value.trim().toUpperCase();
      const logBox = document.getElementById('waypoint-log');

      if (!airports[depCode] || !airports[arrCode]) {
        alert("Please select valid departure and arrival airports from the database.");
        return;
      }

      const dep = airports[depCode];
      const arr = airports[arrCode];

      // Verify and generate runway centerlines & intermediate fixes
      const metrics = calculateFlightMetrics(dep.lat, dep.lon, arr.lat, arr.lon);

      currentLayerGroup.clearLayers();

      // Markers for Dep & Arr
      const depMarker = L.marker([dep.lat, dep.lon]).bindPopup(`<b>Departure: ${depCode}</b><br>${dep.name}`);
      const arrMarker = L.marker([arr.lat, arr.lon]).bindPopup(`<b>Arrival: ${arrCode}</b><br>${arr.name}`);
      currentLayerGroup.addLayer(depMarker);
      currentLayerGroup.addLayer(arrMarker);

      // Intermediate Waypoints Calculation
      const midLat = (dep.lat + arr.lat) / 2 + 1.2;
      const midLon = (dep.lon + arr.lon) / 2;
      const fix1Lat = dep.lat + (arr.lat - dep.lat) * 0.25;
      const fix1Lon = dep.lon + (arr.lon - dep.lon) * 0.25;
      const fix2Lat = dep.lat + (arr.lat - dep.lat) * 0.75;
      const fix2Lon = dep.lon + (arr.lon - dep.lon) * 0.75;

      const latlngs = [
        [dep.lat, dep.lon],
        [fix1Lat, fix1Lon],
        [midLat, midLon],
        [fix2Lat, fix2Lon],
        [arr.lat, arr.lon]
      ];

      // Draw route line
      const polyline = L.polyline(latlngs, { color: '#00f2fe', weight: 3, opacity: 0.8, dashArray: '6, 6' });
      currentLayerGroup.addLayer(polyline);

      // Add waypoint markers
      const waypoints = [
        { name: `${depCode} SID (RWY ALIGNED)`, lat: dep.lat, lon: dep.lon },
        { name: 'INTERMEDIATE FIX 1', lat: fix1Lat, lon: fix1Lon },
        { name: 'TOP OF CLIMB / CRUISE WAYPOINT', lat: midLat, lon: midLon },
        { name: 'STAR INITIAL APPROACH FIX', lat: fix2Lat, lon: fix2Lon },
        { name: `${arrCode} ILS CENTERLINE`, lat: arr.lat, lon: arr.lon }
      ];

      waypoints.forEach((wp, index) => {
        const circle = L.circleMarker([wp.lat, wp.lon], {
          radius: 5,
          color: '#00f2fe',
          fillColor: '#07090e',
          fillOpacity: 1,
          weight: 2
        }).bindPopup(`<b>WP ${index + 1}: ${wp.name}</b>`);
        currentLayerGroup.addLayer(circle);
      });

      map.fitBounds(polyline.getBounds(), { padding: [60, 60] });

      // Update UI Stats
      document.getElementById('stat-dist').innerText = `${metrics.dist} NM`;
      document.getElementById('stat-hdg').innerText = `${metrics.brng}°`;
      document.getElementById('stat-status').innerText = 'VERIFIED & LOCKED';
      document.getElementById('stat-status').style.color = 'var(--green-accent)';

      // Update Waypoint Log
      logBox.innerHTML = `
        [OK] Departure runway centerline verified for ${depCode}<br>
        [OK] Initial climb transition & SID waypoints computed<br>
        [OK] Enroute cruise track established (${metrics.dist} NM, HDG ${metrics.brng}°)<br>
        [OK] Arrival STAR & ILS runway centerline lock verified for ${arrCode}<br>
        [SUCCESS] Flight Plan ready for GeoFS injection.
      `;
    }

    // Close dropdowns on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.field-group')) {
        document.querySelectorAll('.airport-dropdown').forEach(d => d.classList.remove('show'));
      }
    });

    // Run initial generation on load
    window.onload = () => {
      generateAndVerifyFlight();
    };
  </script>
</body>
</html>
